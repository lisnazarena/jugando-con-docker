services:
  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      HOST: 0.0.0.0
      API_PORT: 4000
      WEB_PORT: ${WEB_PORT:-8088}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lluvia}:${POSTGRES_PASSWORD:-cambiar-esta-clave}@db:5432/${POSTGRES_DB:-lluvia}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:-aula-de-prueba}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lluvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-esta-clave}
      POSTGRES_DB: ${POSTGRES_DB:-lluvia}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
